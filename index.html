<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>건축물대장 조회</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="top">
  <div>
    <div class="eyebrow">INTERNAL BUILDING LEDGER</div>
    <h1>건축물대장 조회</h1>
    <p>아파트 · 빌라 · 오피스텔 · 상가 · 일반건물</p>
  </div>
  <div id="apiState" class="pill">연결 확인 전</div>
</header>

<main>
  <section class="card search-card">
    <div class="tabs">
      <button class="tab active" data-tab="address">주소로 조회</button>
      <button class="tab" data-tab="codes">코드로 조회</button>
    </div>

    <div id="addressPane" class="pane">
      <label>법정동 + 지번 주소</label>
      <div class="row">
        <input id="address" placeholder="예: 서울특별시 강남구 역삼동 123-4">
        <button id="searchAddress" class="primary">조회</button>
      </div>
      <p class="hint">도로명주소만 있는 경우 자동 변환이 되지 않을 수 있습니다. 그때는 아래 ‘코드로 조회’를 사용하세요.</p>
    </div>

    <div id="codesPane" class="pane hidden">
      <div class="grid4">
        <div><label>시군구코드 5자리</label><input id="sigunguCd" maxlength="5" placeholder="11680"></div>
        <div><label>법정동코드 5자리</label><input id="bjdongCd" maxlength="5" placeholder="10300"></div>
        <div><label>본번</label><input id="bun" placeholder="123"></div>
        <div><label>부번</label><input id="ji" placeholder="4"></div>
      </div>
      <div class="row end">
        <select id="platGbCd">
          <option value="0">대지</option>
          <option value="1">산</option>
          <option value="2">블록</option>
        </select>
        <button id="searchCodes" class="primary">조회</button>
      </div>
    </div>

    <div id="status" class="status"></div>
  </section>

  <section id="resultArea" class="hidden">
    <div class="summary-grid" id="summaryCards"></div>

    <section class="card">
      <div class="section-title">
        <div><h2>건물 기본정보</h2><p id="buildingTitle"></p></div>
      </div>
      <div id="basicInfo" class="info-grid"></div>
    </section>

    <section class="card">
      <div class="section-title">
        <div><h2>표제부 / 동 정보</h2><p>동이 여러 개인 단지는 각 동이 행으로 표시됩니다.</p></div>
        <button class="ghost" data-csv="titles">CSV</button>
      </div>
      <div class="table-wrap"><table id="titlesTable"></table></div>
    </section>

    <section class="card">
      <div class="section-title">
        <div><h2>층별 정보</h2><p>층별 용도와 면적</p></div>
        <div class="actions"><input id="floorFilter" class="small" placeholder="층/용도 검색"><button class="ghost" data-csv="floors">CSV</button></div>
      </div>
      <div class="table-wrap"><table id="floorsTable"></table></div>
    </section>

    <section class="card" id="unitsSection">
      <div class="section-title">
        <div><h2>동 · 호별 전유/공용면적</h2><p>집합건물에 전유부 데이터가 있는 경우 표시됩니다.</p></div>
        <div class="actions"><input id="unitFilter" class="small" placeholder="동/호/면적 검색"><button class="ghost" data-csv="units">CSV</button></div>
      </div>
      <div class="table-wrap"><table id="unitsTable"></table></div>
      <p id="unitNotice" class="notice"></p>
    </section>
  </section>
</main>

<footer>국토교통부 건축HUB 건축물대장정보 서비스 기반 · 내부 업무용</footer>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
