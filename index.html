<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>건축물대장 조회</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1>건축물대장 조회</h1>
    <div id="apiState" class="api-state"><span></span>연결 확인 중</div>
  </div>
</header>

<main class="page">
  <section class="search-panel">
    <div class="search-row">
      <input id="address" type="text" autocomplete="off"
             placeholder="지번 또는 도로명 주소를 입력하세요"
             aria-label="주소 입력">
      <button id="searchAddress" class="search-button">조회</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="resultArea" class="hidden">
    <section class="address-box">
      <div class="address-main">
        <span class="label">조회 주소</span>
        <strong id="resolvedAddress">-</strong>
      </div>
      <div class="code-row" id="queryCodes"></div>
    </section>

    <div class="summary-grid" id="summaryCards"></div>

    <section class="content-card">
      <div class="section-head">
        <div>
          <h2>건물 기본정보</h2>
          <p id="buildingTitle"></p>
        </div>
      </div>
      <div id="basicInfo" class="info-grid"></div>
    </section>

    <section class="content-card">
      <div class="section-head">
        <h2>표제부 · 동 정보</h2>
        <button class="outline-button" data-csv="titles">CSV 저장</button>
      </div>
      <div class="table-wrap"><table id="titlesTable"></table></div>
    </section>

    <section class="content-card">
      <div class="section-head">
        <h2>층별 정보</h2>
        <div class="actions">
          <input id="floorFilter" class="filter-input" placeholder="층 또는 용도 검색">
          <button class="outline-button" data-csv="floors">CSV 저장</button>
        </div>
      </div>
      <div class="table-wrap"><table id="floorsTable"></table></div>
    </section>

    <section class="content-card" id="unitsSection">
      <div class="section-head">
        <h2>동 · 호별 면적</h2>
        <div class="actions">
          <input id="unitFilter" class="filter-input" placeholder="동 또는 호 검색">
          <button class="outline-button" data-csv="units">CSV 저장</button>
        </div>
      </div>
      <div class="table-wrap"><table id="unitsTable"></table></div>
      <p id="unitNotice" class="notice"></p>
    </section>
  </section>
</main>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
